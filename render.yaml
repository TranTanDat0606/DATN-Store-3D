# Render web service for the Express API.
#
# W1.5 fixes (verified locally, NOT deployed):
#  - rootDirectory: server — the previous config ran `npm run build` / `npm start`
#    at the repository root, but the root package.json declares neither script,
#    so both the build and the start command failed.
#  - `npm ci` instead of `npm install` so the lockfile is authoritative.
#  - server/tsconfig.json now emits CommonJS, matching api/tsconfig.json, so
#    `node dist/server.js` actually resolves its imports.
#
# RELEASE_FEATURES is deliberately NOT defaulted here. When unset in
# production the server keeps serving exactly the capabilities that already
# serve traffic (PRODUCTION_FALLBACK = foundation, auth.login, auth.register,
# catalog, news, account) and keeps banners/cms.* off. Setting the variable
# explicitly REPLACES that list — omitting a live key will 404 those routes
# in production. Set it deliberately per deployment when releasing something
# new or retiring a capability.
services:
  - type: web
    name: store3d-api
    runtime: node
    plan: free
    rootDirectory: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Required for payment confirmation. While unset the payment webhook
      # answers 503 (fail closed) rather than accepting unsigned callbacks.
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
      - key: RELEASE_FEATURES
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 300
      - key: AUTH_RATE_LIMIT_MAX
        value: 20
      - key: BANK_BIN
        value: 970423
      # Explicit unconfigured placeholders: real bank details are customer data
      # and must be supplied by the operator, never invented here.
      - key: BANK_ACCOUNT_NUMBER
        value: "YOUR_BANK_ACCOUNT_NUMBER"
      - key: BANK_ACCOUNT_NAME
        value: YOUR_ACCOUNT_NAME
      - key: BANK_ACCOUNT_DISPLAY_NAME
        value: YOUR_ACCOUNT_DISPLAY_NAME
      - key: QR_TTL_MINUTES
        value: "5"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06071a"/>
      <stop offset="60%" stop-color="#0A0E1F"/>
      <stop offset="100%" stop-color="#131A33"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6FC4"/>
      <stop offset="100%" stop-color="#ff3daa"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DE8FF"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#0A0E1F"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1280" height="720" fill="url(#skyGrad)"/>

  <!-- Stars -->
  <g opacity="0.4">
    <circle cx="120" cy="80" r="1.2" fill="#fff"/>
    <circle cx="280" cy="50" r="0.8" fill="#fff"/>
    <circle cx="400" cy="100" r="1" fill="#fff"/>
    <circle cx="550" cy="40" r="1.5" fill="#fff"/>
    <circle cx="700" cy="90" r="0.7" fill="#fff"/>
    <circle cx="850" cy="60" r="1.3" fill="#fff"/>
    <circle cx="1000" cy="45" r="0.9" fill="#fff"/>
    <circle cx="1150" cy="85" r="1.1" fill="#fff"/>
    <circle cx="180" cy="130" r="0.6" fill="#fff"/>
    <circle cx="350" cy="160" r="1" fill="#fff"/>
    <circle cx="620" cy="140" r="0.8" fill="#fff"/>
    <circle cx="900" cy="120" r="1.2" fill="#fff"/>
    <circle cx="1100" cy="150" r="0.7" fill="#fff"/>
    <circle cx="200" cy="200" r="0.5" fill="#fff"/>
    <circle cx="480" cy="180" r="0.9" fill="#fff"/>
    <circle cx="780" cy="170" r="0.6" fill="#fff"/>
    <circle cx="1050" cy="190" r="1" fill="#fff"/>
  </g>

  <!-- Nebula glow -->
  <ellipse cx="380" cy="200" rx="180" ry="100" fill="#FF6FC4" opacity="0.04"/>
  <ellipse cx="900" cy="180" rx="140" ry="80" fill="#B98BFF" opacity="0.05"/>
  <ellipse cx="640" cy="250" rx="200" ry="60" fill="#4DE8FF" opacity="0.03"/>

  <!-- Distant buildings (silhouette) -->
  <g fill="#0d1225" opacity="0.7">
    <rect x="30" y="380" width="50" height="220"/>
    <rect x="90" y="340" width="40" height="260"/>
    <rect x="140" y="400" width="55" height="200"/>
    <rect x="200" y="350" width="45" height="250"/>
    <rect x="255" y="370" width="60" height="230"/>
    <rect x="320" y="320" width="35" height="280"/>
    <rect x="365" y="390" width="50" height="210"/>
    <rect x="425" y="340" width="40" height="260"/>
    <rect x="475" y="360" width="55" height="240"/>
    <rect x="540" y="310" width="45" height="290"/>
    <rect x="595" y="380" width="60" height="220"/>
    <rect x="660" y="330" width="40" height="270"/>
    <rect x="710" y="350" width="50" height="250"/>
    <rect x="770" y="370" width="35" height="230"/>
    <rect x="815" y="320" width="55" height="280"/>
    <rect x="880" y="360" width="45" height="240"/>
    <rect x="935" y="340" width="50" height="260"/>
    <rect x="990" y="380" width="40" height="220"/>
    <rect x="1040" y="350" width="55" height="250"/>
    <rect x="1100" y="330" width="45" height="270"/>
    <rect x="1155" y="370" width="50" height="230"/>
    <rect x="1210" y="340" width="40" height="260"/>
  </g>

  <!-- Mid buildings (detailed with neon signs) -->
  <g>
    <rect x="20" y="420" width="70" height="180" rx="2" fill="#111830"/>
    <rect x="100" y="380" width="80" height="220" rx="2" fill="#131A33"/>
    <rect x="200" y="400" width="65" height="200" rx="2" fill="#111830"/>
    <rect x="280" y="360" width="75" height="240" rx="2" fill="#131A33"/>
    <rect x="370" y="410" width="60" height="190" rx="2" fill="#111830"/>
    <rect x="445" y="370" width="70" height="230" rx="2" fill="#131A33"/>
    <rect x="530" y="390" width="80" height="210" rx="2" fill="#111830"/>
    <rect x="620" y="350" width="65" height="250" rx="2" fill="#131A33"/>
    <rect x="700" y="400" width="75" height="200" rx="2" fill="#111830"/>
    <rect x="790" y="360" width="70" height="240" rx="2" fill="#131A33"/>
    <rect x="875" y="380" width="80" height="220" rx="2" fill="#111830"/>
    <rect x="970" y="350" width="65" height="250" rx="2" fill="#131A33"/>
    <rect x="1050" y="390" width="70" height="210" rx="2" fill="#111830"/>
    <rect x="1135" y="370" width="80" height="230" rx="2" fill="#131A33"/>
    <rect x="1220" y="400" width="60" height="200" rx="2" fill="#111830"/>
  </g>

  <!-- Neon windows on mid buildings -->
  <g opacity="0.3">
    <!-- Building at x=100 -->
    <rect x="115" y="400" width="4" height="6" fill="#4DE8FF"/>
    <rect x="130" y="400" width="4" height="6" fill="#4DE8FF"/>
    <rect x="145" y="400" width="4" height="6" fill="#4DE8FF"/>
    <rect x="115" y="420" width="4" height="6" fill="#FF6FC4"/>
    <rect x="130" y="420" width="4" height="6" fill="#4DE8FF"/>
    <rect x="145" y="420" width="4" height="6" fill="#B98BFF"/>
    <rect x="115" y="440" width="4" height="6" fill="#4DE8FF"/>
    <rect x="130" y="440" width="4" height="6" fill="#FF6FC4"/>
    <!-- Building at x=280 -->
    <rect x="295" y="380" width="4" height="6" fill="#FF6FC4"/>
    <rect x="310" y="380" width="4" height="6" fill="#4DE8FF"/>
    <rect x="325" y="380" width="4" height="6" fill="#B98BFF"/>
    <rect x="295" y="400" width="4" height="6" fill="#4DE8FF"/>
    <rect x="310" y="400" width="4" height="6" fill="#FF6FC4"/>
    <rect x="325" y="400" width="4" height="6" fill="#4DE8FF"/>
    <!-- Building at x=445 -->
    <rect x="460" y="390" width="4" height="6" fill="#4DE8FF"/>
    <rect x="475" y="390" width="4" height="6" fill="#FF6FC4"/>
    <rect x="490" y="390" width="4" height="6" fill="#4DE8FF"/>
    <rect x="460" y="410" width="4" height="6" fill="#B98BFF"/>
    <rect x="475" y="410" width="4" height="6" fill="#4DE8FF"/>
    <!-- Building at x=620 -->
    <rect x="635" y="370" width="4" height="6" fill="#FF6FC4"/>
    <rect x="650" y="370" width="4" height="6" fill="#4DE8FF"/>
    <rect x="665" y="370" width="4" height="6" fill="#B98BFF"/>
    <rect x="635" y="390" width="4" height="6" fill="#4DE8FF"/>
    <rect x="650" y="390" width="4" height="6" fill="#FF6FC4"/>
    <!-- Building at x=790 -->
    <rect x="805" y="380" width="4" height="6" fill="#4DE8FF"/>
    <rect x="820" y="380" width="4" height="6" fill="#FF6FC4"/>
    <rect x="835" y="380" width="4" height="6" fill="#4DE8FF"/>
    <rect x="805" y="400" width="4" height="6" fill="#B98BFF"/>
    <rect x="820" y="400" width="4" height="6" fill="#4DE8FF"/>
    <!-- Building at x=970 -->
    <rect x="985" y="370" width="4" height="6" fill="#FF6FC4"/>
    <rect x="1000" y="370" width="4" height="6" fill="#4DE8FF"/>
    <rect x="1015" y="370" width="4" height="6" fill="#B98BFF"/>
    <rect x="985" y="390" width="4" height="6" fill="#4DE8FF"/>
    <!-- Building at x=1135 -->
    <rect x="1150" y="390" width="4" height="6" fill="#4DE8FF"/>
    <rect x="1165" y="390" width="4" height="6" fill="#FF6FC4"/>
    <rect x="1180" y="390" width="4" height="6" fill="#B98BFF"/>
    <rect x="1150" y="410" width="4" height="6" fill="#4DE8FF"/>
    <rect x="1165" y="410" width="4" height="6" fill="#FF6FC4"/>
  </g>

  <!-- Neon signs on buildings -->
  <g filter="url(#glow)">
    <rect x="110" y="395" width="50" height="8" rx="2" fill="#FF6FC4" opacity="0.5"/>
    <rect x="290" y="375" width="45" height="8" rx="2" fill="#B98BFF" opacity="0.5"/>
    <rect x="455" y="385" width="40" height="8" rx="2" fill="#4DE8FF" opacity="0.5"/>
    <rect x="630" y="365" width="50" height="8" rx="2" fill="#FF6FC4" opacity="0.5"/>
    <rect x="800" y="375" width="45" height="8" rx="2" fill="#B98BFF" opacity="0.5"/>
    <rect x="980" y="365" width="40" height="8" rx="2" fill="#4DE8FF" opacity="0.5"/>
    <rect x="1145" y="385" width="50" height="8" rx="2" fill="#FF6FC4" opacity="0.5"/>
  </g>

  <!-- Street lamps -->
  <g>
    <rect x="80" y="460" width="2" height="60" fill="#2a3050" opacity="0.6"/>
    <circle cx="81" cy="458" r="4" fill="#4DE8FF" opacity="0.4" filter="url(#glow)"/>
    <rect x="250" y="460" width="2" height="60" fill="#2a3050" opacity="0.6"/>
    <circle cx="251" cy="458" r="4" fill="#4DE8FF" opacity="0.4" filter="url(#glow)"/>
    <rect x="420" y="460" width="2" height="60" fill="#2a3050" opacity="0.6"/>
    <circle cx="421" cy="458" r="4" fill="#4DE8FF" opacity="0.4" filter="url(#glow)"/>
    <rect x="590" y="460" width="2" height="60" fill="#2a3050" opacity="0.6"/>
    <circle cx="591" cy="458" r="4" fill="#4DE8FF" opacity="0.4" filter="url(#glow)"/>
    <rect x="760" y="460" width="2" height="60" fill="#2a3050" opacity="0.6"/>
    <circle cx="761" cy="458" r="4" fill="#4DE8FF" opacity="0.4" filter="url(#glow)"/>
    <rect x="930" y="460" width="2" height="60" fill="#2a3050" opacity="0.6"/>
    <circle cx="931" cy="458" r="4" fill="#4DE8FF" opacity="0.4" filter="url(#glow)"/>
    <rect x="1100" y="460" width="2" height="60" fill="#2a3050" opacity="0.6"/>
    <circle cx="1101" cy="458" r="4" fill="#4DE8FF" opacity="0.4" filter="url(#glow)"/>
  </g>

  <!-- Road -->
  <rect x="0" y="520" width="1280" height="200" fill="url(#groundGrad)"/>
  <rect x="0" y="520" width="1280" height="2" fill="#4DE8FF" opacity="0.6"/>
  <rect x="0" y="522" width="1280" height="1" fill="#4DE8FF" opacity="0.15"/>

  <!-- Road lane markings -->
  <g opacity="0.2">
    <rect x="50" y="570" width="40" height="2" rx="1" fill="#4DE8FF"/>
    <rect x="160" y="570" width="40" height="2" rx="1" fill="#4DE8FF"/>
    <rect x="270" y="570" width="40" height="2" rx="1" fill="#4DE8FF"/>
    <rect x="380" y="570" width="40" height="2" rx="1" fill="#4DE8FF"/>
    <rect x="490" y="570" width="40" height="2" rx="1" fill="#4DE8FF"/>
    <rect x="600" y="570" width="40" height="2" rx="1" fill="#4DE8FF"/>
    <rect x="710" y="570" width="40" height="2" rx="1" fill="#4DE8FF"/>
    <rect x="820" y="570" width="40" height="2" rx="1" fill="#4DE8FF"/>
    <rect x="930" y="570" width="40" height="2" rx="1" fill="#4DE8FF"/>
    <rect x="1040" y="570" width="40" height="2" rx="1" fill="#4DE8FF"/>
    <rect x="1150" y="570" width="40" height="2" rx="1" fill="#4DE8FF"/>
  </g>

  <!-- Road reflection -->
  <rect x="0" y="590" width="1280" height="60" fill="#4DE8FF" opacity="0.02"/>
  <rect x="0" y="620" width="1280" height="60" fill="#FF6FC4" opacity="0.015"/>

  <!-- Wet road reflection effect -->
  <rect x="0" y="700" width="1280" height="20" fill="#FF6FC4" opacity="0.1"/>

  <!-- === CHARACTER SILHOUETTES === -->

  <!-- Pink Cyber Cat (left side, running pose) -->
  <g transform="translate(200, 430)" filter="url(#softGlow)">
    <!-- Body -->
    <ellipse cx="0" cy="30" rx="22" ry="18" fill="#FF6FC4" opacity="0.85"/>
    <!-- Head -->
    <circle cx="18" cy="10" r="14" fill="#FF6FC4" opacity="0.85"/>
    <!-- Ears -->
    <polygon points="10,-4 6,-18 16,-6" fill="#FF6FC4" opacity="0.85"/>
    <polygon points="24,-4 28,-18 18,-6" fill="#FF6FC4" opacity="0.85"/>
    <!-- Inner ears -->
    <polygon points="11,-2 9,-14 15,-5" fill="#ffb3d9" opacity="0.5"/>
    <polygon points="23,-2 25,-14 19,-5" fill="#ffb3d9" opacity="0.5"/>
    <!-- Eyes (glowing cyan) -->
    <ellipse cx="12" cy="8" rx="3" ry="2.5" fill="#4DE8FF" opacity="0.9"/>
    <ellipse cx="24" cy="8" rx="3" ry="2.5" fill="#4DE8FF" opacity="0.9"/>
    <circle cx="12" cy="8" r="1.5" fill="#fff" opacity="0.8"/>
    <circle cx="24" cy="8" r="1.5" fill="#fff" opacity="0.8"/>
    <!-- Nose -->
    <ellipse cx="18" cy="14" rx="2" ry="1.5" fill="#ffb3d9" opacity="0.7"/>
    <!-- Mouth -->
    <path d="M15,16 Q18,20 21,16" stroke="#ffb3d9" stroke-width="1" fill="none" opacity="0.6"/>
    <!-- Legs (running) -->
    <rect x="-14" y="42" width="6" height="16" rx="3" fill="#e05aa0" opacity="0.8"/>
    <rect x="-4" y="44" width="6" height="14" rx="3" fill="#e05aa0" opacity="0.8"/>
    <rect x="8" y="40" width="6" height="18" rx="3" fill="#e05aa0" opacity="0.8"/>
    <rect x="18" y="42" width="6" height="16" rx="3" fill="#e05aa0" opacity="0.8"/>
    <!-- Tail -->
    <path d="M-22,25 Q-35,15 -30,0 Q-25,-10 -18,5" stroke="#FF6FC4" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Gun (laser) -->
    <rect x="28" y="16" width="20" height="5" rx="2" fill="#4DE8FF" opacity="0.8"/>
    <circle cx="50" cy="18.5" r="3" fill="#4DE8FF" opacity="0.9" filter="url(#glow)"/>
  </g>

  <!-- Robotic Bird (upper right, flying) -->
  <g transform="translate(920, 320)" filter="url(#softGlow)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="#B98BFF" opacity="0.8"/>
    <!-- Head -->
    <circle cx="18" cy="-8" r="10" fill="#8B6FBF" opacity="0.8"/>
    <!-- Eye (red) -->
    <circle cx="22" cy="-10" r="3.5" fill="#ff3333" opacity="0.9"/>
    <circle cx="22" cy="-10" r="1.5" fill="#fff" opacity="0.7"/>
    <!-- Beak -->
    <polygon points="28,-8 36,-6 28,-4" fill="#FF6FC4" opacity="0.7"/>
    <!-- Wings -->
    <path d="M-5,-8 Q-25,-30 -15,-25 Q-5,-20 0,-10" fill="#9B7DCF" opacity="0.7"/>
    <path d="M-5,8 Q-25,28 -15,23 Q-5,18 0,10" fill="#9B7DCF" opacity="0.6"/>
    <!-- Tail feathers -->
    <path d="M-20,0 L-35,-8 L-30,0 L-35,8 Z" fill="#B98BFF" opacity="0.6"/>
    <!-- Metallic accents -->
    <rect x="-8" y="-3" width="16" height="6" rx="2" fill="#666" opacity="0.4"/>
  </g>

  <!-- Cyber Mouse (right side, with sword) -->
  <g transform="translate(1050, 440)" filter="url(#softGlow)">
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="18" ry="15" fill="#666" opacity="0.8"/>
    <!-- Head -->
    <circle cx="0" cy="0" r="12" fill="#777" opacity="0.8"/>
    <!-- Ears (large round) -->
    <circle cx="-10" cy="-12" r="8" fill="#888" opacity="0.7"/>
    <circle cx="10" cy="-12" r="8" fill="#888" opacity="0.7"/>
    <circle cx="-10" cy="-12" r="5" fill="#FF6FC4" opacity="0.3"/>
    <circle cx="10" cy="-12" r="5" fill="#FF6FC4" opacity="0.3"/>
    <!-- Eyes (red glowing) -->
    <circle cx="-5" cy="-2" r="2.5" fill="#ff3333" opacity="0.9"/>
    <circle cx="5" cy="-2" r="2.5" fill="#ff3333" opacity="0.9"/>
    <circle cx="-5" cy="-2" r="1" fill="#fff" opacity="0.7"/>
    <circle cx="5" cy="-2" r="1" fill="#fff" opacity="0.7"/>
    <!-- Nose -->
    <circle cx="0" cy="3" r="1.5" fill="#FF6FC4" opacity="0.6"/>
    <!-- Whiskers -->
    <line x1="-14" y1="0" x2="-25" y2="-3" stroke="#999" stroke-width="0.5" opacity="0.5"/>
    <line x1="-14" y1="3" x2="-25" y2="5" stroke="#999" stroke-width="0.5" opacity="0.5"/>
    <line x1="14" y1="0" x2="25" y2="-3" stroke="#999" stroke-width="0.5" opacity="0.5"/>
    <line x1="14" y1="3" x2="25" y2="5" stroke="#999" stroke-width="0.5" opacity="0.5"/>
    <!-- Legs -->
    <rect x="-10" y="32" width="5" height="12" rx="2.5" fill="#555" opacity="0.7"/>
    <rect x="5" y="32" width="5" height="12" rx="2.5" fill="#555" opacity="0.7"/>
    <!-- Tail -->
    <path d="M0,35 Q10,50 5,60" stroke="#888" stroke-width="2" fill="none" opacity="0.5"/>
    <!-- Sword (laser sword) -->
    <rect x="16" y="-5" width="4" height="25" rx="1" fill="#444" opacity="0.7"/>
    <rect x="15" y="-5" width="6" height="3" rx="1" fill="#FF6FC4" opacity="0.8"/>
    <rect x="16.5" y="-25" width="3" height="22" rx="1" fill="#FF6FC4" opacity="0.7" filter="url(#glow)"/>
  </g>

  <!-- === TITLE TEXT === -->

  <!-- MIU-9 -->
  <text x="640" y="200" text-anchor="middle" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="80" font-weight="900" fill="url(#neonCyan)" filter="url(#textGlow)" letter-spacing="8">MIU-9</text>

  <!-- FUTURE RUN -->
  <text x="640" y="260" text-anchor="middle" font-family="'Orbitron', 'Arial Black', sans-serif" font-size="48" font-weight="700" fill="url(#neonPink)" filter="url(#textGlow)" letter-spacing="6">FUTURE RUN</text>

  <!-- ENDLESS RUNNER subtitle -->
  <text x="640" y="300" text-anchor="middle" font-family="'Arial', sans-serif" font-size="16" font-weight="400" fill="#8FA3C4" letter-spacing="10" text-transform="uppercase">ENDLESS RUNNER</text>

  <!-- Decorative lines under title -->
  <line x1="440" y1="315" x2="840" y2="315" stroke="#4DE8FF" stroke-width="1" opacity="0.3"/>
  <line x1="500" y1="320" x2="780" y2="320" stroke="#FF6FC4" stroke-width="1" opacity="0.2"/>
</svg>

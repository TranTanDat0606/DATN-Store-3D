name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server - typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: TypeScript check (tsc build)
        run: npm run build

      - name: Unit tests (node:test - no DB, no seed, no migration)
        run: npm test

  client:
    name: Client - lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck + build (tsc -b && vite build)
        run: npm run build
